appId: ai.deepseek.harness.desktop
productName: Harness Desktop
artifactName: Harness-Desktop-${version}-${arch}.${ext}
asar: true
directories:
  output: release
publish:
  - provider: github
    owner: changyinliangbaikai
    repo: dsh-desktop
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/runtime
    to: runtime
mac:
  icon: build/icon.icns
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
