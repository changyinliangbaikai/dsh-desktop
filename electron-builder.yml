appId: ai.deepseek.harness.desktop
productName: Harness Desktop
artifactName: Harness-Desktop-${version}-${arch}.${ext}
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/runtime
    to: runtime
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
