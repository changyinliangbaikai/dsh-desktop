name: CI

on:
  push:
  pull_request:

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test with coverage
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build

  windows-checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test with coverage
        shell: pwsh
        run: |
          $testOutput = pnpm run test:coverage 2>&1 | Out-String
          $testExitCode = $LASTEXITCODE
          Write-Output $testOutput

          if ($testExitCode -ne 0) {
            $tailLength = [Math]::Min(12000, $testOutput.Length)
            $testTail = $testOutput.Substring($testOutput.Length - $tailLength)
            $escapedTail = $testTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows test output::$escapedTail"
            exit $testExitCode
          }
      - name: Build
        run: pnpm run build
