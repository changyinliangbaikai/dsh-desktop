name: Windows package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer as a GitHub prerelease
        type: boolean
        default: false
      diagnosePreview:
        description: Test Office preview in the published native.2 installer without rebuilding
        type: boolean
        default: false
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

jobs:
  diagnose-preview:
    if: inputs.diagnosePreview == true
    uses: ./.github/workflows/native-preview-diagnosis.yml
  package-windows:
    if: inputs.diagnosePreview != true
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
      version: ${{ steps.upstream.outputs.version }}
    defaults:
      run:
        working-directory: Dsh-Desktop
    env:
      DSH_TELEMETRY_DISABLED: '1'
      LEFTHOOK: '0'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          path: Dsh-Desktop
          persist-credentials: false
      - name: Read native upstream pin
        id: upstream
        shell: pwsh
        run: |
          $pin = Get-Content packaging/native-upstream.json | ConvertFrom-Json
          "commit=$($pin.commit)" >> $env:GITHUB_OUTPUT
          $package = Get-Content package.json | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.commit }}
          path: .artifacts/native-desktop/upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: Dsh-Desktop/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: |
            Dsh-Desktop/pnpm-lock.yaml
            .artifacts/native-desktop/upstream/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enable native dependency symlinks
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable Windows Developer Mode' }
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "desktop-v$version") { throw 'Release tag does not match downstream version' }
      - name: Install downstream dependencies
        run: pnpm install --frozen-lockfile
      - name: Install independently locked offline plugin
        run: pnpm run offline-plugin:install
      - name: Run repository gates
        run: pnpm run check
      - name: Install exact upstream dependency graph
        run: pnpm --dir ../.artifacts/native-desktop/upstream install --frozen-lockfile
      - name: Check upstream peer dependencies
        run: pnpm --dir ../.artifacts/native-desktop/upstream peers check
      - name: Restore exact native preparation
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          key: native-windows-2022-node24.19-pnpm11.7-v2-${{ steps.upstream.outputs.commit }}
          path: |
            .artifacts/native-desktop/upstream/apps/desktop/lib
            .artifacts/native-desktop/upstream/apps/desktop/.desktop-build/targets/win-x64/dsh
            .artifacts/native-desktop/upstream/apps/desktop/.desktop-build/targets/win-x64/runtime
            .artifacts/native-desktop/upstream/apps/desktop/.desktop-build/targets/win-x64/electron
      - name: Prepare native desktop and smoke its runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: pnpm run native:stage
      - name: Build upstream acceptance dependencies for a cached runtime
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: pnpm --dir ../.artifacts/native-desktop/upstream run build:official
      - name: Cache verified unmodified native preparation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            .artifacts/native-desktop/upstream/apps/desktop/lib
            .artifacts/native-desktop/upstream/apps/desktop/.desktop-build/targets/win-x64/dsh
            .artifacts/native-desktop/upstream/apps/desktop/.desktop-build/targets/win-x64/runtime
            .artifacts/native-desktop/upstream/apps/desktop/.desktop-build/targets/win-x64/electron
      - name: Apply and inventory intranet configuration
        run: pnpm run native:overlay
      - name: Package native unsigned Windows installer
        run: pnpm run pack:win
      - name: Record Windows runtime prerequisites
        shell: pwsh
        run: |
          $files = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') | ForEach-Object {
            $dll = Join-Path $env:SystemRoot "System32/$_"
            if (-not (Test-Path $dll)) { throw "Missing required system runtime: $_" }
            @{ name = $_; version = (Get-Item $dll).VersionInfo.FileVersion }
          }
          @{ platform = 'Windows Server 2022 hosted runner'; visualCppRuntime = $files; bundledByInstaller = $false; cleanWindows10Acceptance = 'pending' } | ConvertTo-Json -Depth 5 | Set-Content ../.artifacts/native-desktop/release/prerequisite-evidence.json
      - name: Verify PDF conversion, offline installation and native window lifecycle
        run: pnpm run native:verify
      - name: Upload verified installer and evidence
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: harness-native-intranet-windows-x64
          path: |
            .artifacts/native-desktop/release/*.exe
            .artifacts/native-desktop/release/*.blockmap
            .artifacts/native-desktop/release/*.json
            .artifacts/native-desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve an unverified installer for diagnosing a failed gate
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unverified-native-windows-installer
          path: .artifacts/native-desktop/release/*.exe
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub prerelease
    needs: package-windows
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')) || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package-windows.outputs.artifact-id }}
          path: release-files
          digest-mismatch: error
      - name: Verify release checksums
        working-directory: release-files
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish native Windows pilot
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ needs.package-windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Harness Desktop Intranet ${{ needs.package-windows.outputs.version }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Native DeepSeek Harness 0.1.7-rc.2 desktop, pinned to 477b4f420553e8a52c2fbccc464d7561b239c443.

            Windows x64 unsigned pilot. Web Search is disabled in the provider and all shipped agent presets. Web fetch remains available. No automatic update feed or upstream mandatory-update policy is embedded. Includes offline installer 0.3.0 in the active Desktop Profile. The upstream Windows tray hides the window after its first-close acknowledgement; click to restore, or choose Exit from its menu. Native Host shutdown remains unchanged.

            Windows Office conversion requires the x64 Microsoft Visual C++ v14 Redistributable, installed separately from Microsoft before using a clean offline PC. The hosted runner already has this prerequisite; its DLL versions are attached in prerequisite-evidence.json.

            Download the EXE and compare SHA256SUMS.txt. Build evidence and the configuration overlay hashes are attached. CI verifies the sealed ASAR runtime and complete native unpacking, converts DOCX/XLSX/PPTX to PDF and exercises the standalone Office CLI, installs an offline fixture and checks activation after restart, verifies Web Search tool registries, and exercises native window close/restore/quit. Interactive Windows installation and intranet model connectivity still require testing. Back up existing Harness data before testing; data-format downgrade is not guaranteed.
          files: |
            release-files/*
